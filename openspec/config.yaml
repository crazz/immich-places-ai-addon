schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  MANDATORY: Invoke the 'openspec-plus-apply' skill immediately when openspec-apply-change is invoked
  Before creating or updating artifacts, read and follow the adopted project standards:
  - docs/engineering/architecture.md
  - docs/engineering/testing.md
  - docs/engineering/coding-standards.md
  Follow AGENTS.md for project working agreements and required tool workflows.
  Use GitNexus for codebase exploration, dependency/execution tracing, pre-edit blast radius,
  refactoring and pre-commit change analysis, following the architecture standard's workflow.
  Verify index freshness and unresolved/incomplete graph results against actual source and tests.
  Use TDD for new or changed behavior. Characterization tests for known existing behavior
  may pass immediately against unchanged application code; do not manufacture failures
  or require mutation testing. Follow the adopted testing standard over blanket skill rules.
  For AI Locate, use docs/ai-locate/README.md to locate the PRD, technical design,
  reconciliation and roadmap; read the sections relevant to this change.
  The standards are adopted; F01 shared checks, F02 frontend tests and F03 browser smoke tests are installed.
  Read docs/engineering/testing.md for usable commands and comparison-base selection.
  F02 enforces the frontend AI coverage policy when AI code exists; absent AI is unmeasured.
  CH01 installs backend AI coverage enforcement across core and integration/adapters in the race gate.
  CH01 provider settings, CH02 bounded provider transport, CH03 explicit synthetic capability
  tests and CH04 source-local capture-date consistency are implemented.
  CH05 explicit snapshots and CH06 all-matching snapshots, persistent installation binding and bounded retention are implemented;
  openspec/specs/ai-selection-snapshots/spec.md is the maintained selection contract.
  CH07 bounded canonical/semantic result validation is implemented in backend/internal/ai/results;
  openspec/specs/ai-location-proposals/spec.md and docs/ai-result-validation.md own its contract/handoff.
  CH08 bounded transient image preparation is implemented in backend/internal/ai/images with
  read-only root adapters; docs/ai-image-preparation.md and its verification record define the handoff.
  It has no public route, provider dispatch or durable job consumer.
  CH09 internal Visual analysis is implemented in backend/internal/ai/analysis with read-only root
  authority adapters and providerhttp codecs. docs/ai-visual-analysis.md defines its one-attempt
  handoff; no public admission, durable worker or production analysis is connected.
  CH11 durable jobs are implemented in backend/internal/ai/jobs with root SQLite adapters and
  migration 022, covering idempotency, leases, bounded reservations/recovery, cancellation,
  immutable results and installation/private-history lifecycle. docs/ai-analysis-jobs.md defines
  the internal contract. No public route or startup worker is connected; CH12 owns production
  selection/consent/access admission, real Visual integration and token/cost accounting.
  GATE-03 has recorded live synthetic evidence for gpt-5.6-sol through the existing NAS codex-proxy:
  docs/engineering/nas-provider-capability-2026-09-19.md. It covers only that runtime/configuration;
  production rollout, durable analysis admission and writeback remain planned.
  Reference documents and embedded prompts do not authorize implementation or live calls.
  Distinguish implemented behavior, planned requirements and unverified compatibility.

rules:
  proposal:
    - "MANDATORY: Invoke the 'openspec-plus-proposal' skill BEFORE writing the proposal."
    - "Scope one coherent outcome with prerequisites and non-goals; apply the roadmap's change-sizing rules and identify any proposed departure from adopted standards."
  specs:
    - "MANDATORY: Invoke the 'openspec-plus-spec' skill BEFORE writing any specification."
    - "Define observable success, authorization and failure scenarios for each affected behavior; retain requirement traceability without copying the engineering rulebook into capability specs."
  design:
    - "MANDATORY: Invoke the 'openspec-plus-design' skill BEFORE writing the design document."
    - "Identify affected package boundaries, dependency direction, data ownership, migrations, failure/recovery handling and applicable verification gates. Reference the adopted standards and accepted ADRs."
    - "Record architectural departures as explicit decisions and reconcile the affected standards/design together; an individual change does not silently override project rules."
  tasks:
    - "MANDATORY: Invoke the 'openspec-plus-tasks' skill BEFORE writing the tasks file."
    - "Map each behavior scenario to automated tests and sequence implementation through Plus TDD. Include applicable size/import, lint/type, persistence, race, build and acceptance checks; use document/configuration checks for documentation-only work."
    - "List missing verification infrastructure as a prerequisite; do not claim a pending harness or unexecuted check has passed. Keep live compatibility and quality evidence explicit."
