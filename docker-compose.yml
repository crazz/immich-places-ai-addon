services:
    frontend:
        build: .
        ports:
            - '${FRONTEND_PORT:-3032}:3032'
        environment:
            - PORT=${FRONTEND_PORT:-3032}
            - BACKEND_URL=http://backend:8082
            - CARTO_API_KEY=${CARTO_API_KEY:-}
        depends_on:
            - backend
        restart: unless-stopped

    backend:
        build: ./backend
        expose:
            - '8082'
        environment:
            - IMMICH_URL=${IMMICH_URL}
            - IMMICH_EXTERNAL_URL=${IMMICH_EXTERNAL_URL:-}
            - ENCRYPTION_KEY=${ENCRYPTION_KEY}
            - AI_ENABLED=${AI_ENABLED:-false}
            - AI_PUBLIC_ORIGIN=${AI_PUBLIC_ORIGIN:-}
            - AI_PROVIDER_EGRESS_POLICY=${AI_PROVIDER_EGRESS_POLICY:-}
            - AI_EXECUTION_POLICIES=${AI_EXECUTION_POLICIES:-[]}
            - AI_JOB_WORKERS=${AI_JOB_WORKERS:-2}
            - AI_JOB_PER_OWNER=${AI_JOB_PER_OWNER:-1}
            - AI_JOB_LEASE_SECONDS=${AI_JOB_LEASE_SECONDS:-180}
            - AI_JOB_HEARTBEAT_SECONDS=${AI_JOB_HEARTBEAT_SECONDS:-30}
            - AI_JOB_IDLE_MS=${AI_JOB_IDLE_MS:-1000}
            - AI_SELECTION_MAX_ASSETS=${AI_SELECTION_MAX_ASSETS:-500}
            - AI_SELECTION_TTL_SECONDS=${AI_SELECTION_TTL_SECONDS:-900}
            - AI_INSTANCE_EPOCH=${AI_INSTANCE_EPOCH:-1}
            - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
            - SYNC_INTERVAL_MS=${SYNC_INTERVAL_MS:-300000}
            - PORT=8082
            - TRUST_PROXY_TLS=${TRUST_PROXY_TLS:-true}
            - ALLOW_INSECURE=${ALLOW_INSECURE:-false}
            - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-}
            - GEOCODE_PROVIDER=${GEOCODE_PROVIDER:-nominatim} # comma-separated chain, e.g. "here,google"
            - HERE_API_KEY=${HERE_API_KEY:-}
            - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
            - GEOCODE_API_KEY=${GEOCODE_API_KEY:-}
            - GEOCODE_TIMEOUT=${GEOCODE_TIMEOUT:-10}
            - SUGGESTIONS_NEIGHBOR_WINDOW_HOURS=${SUGGESTIONS_NEIGHBOR_WINDOW_HOURS:-6}
            - DAWARICH_URL=${DAWARICH_URL:-}
            - DAWARICH_SYNC_INTERVAL_MS=${DAWARICH_SYNC_INTERVAL_MS:-86400000}
            - DEBUG=${DEBUG:-false}
        volumes:
            - ${BACKEND_DATA_VOLUME:-backend-data}:/data
        restart: unless-stopped

volumes:
    backend-data:
