name: Engineering checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache-dependency-path: backend/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Download backend dependencies
        working-directory: backend
        run: go mod download
      - name: Confirm dependency files are unchanged
        run: git diff --exit-code -- bun.lock package.json backend/go.mod backend/go.sum
      - name: Run shared verification with an explicit comparison base
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_REVISION"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse --verify 'HEAD^')"
          fi
          base="$(git rev-parse --verify --end-of-options "${base}^{commit}")"
          bun run check --base "$base"
